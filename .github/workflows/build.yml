name: Build ARM64 module

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          targets: aarch64-unknown-linux-musl
      - name: Compile ARM64 tests and package module
        shell: pwsh
        run: ./build.ps1 -Tests
      - name: Upload module, source and checksums
        uses: actions/upload-artifact@v4
        with:
          name: natpierce-kernelsu-arm64
          path: |
            dist/*.zip
            dist/*SHA256SUMS.txt
